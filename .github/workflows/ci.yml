name: ci

# Gentle, deterministic gate: ruff lint + pytest on the supported Python
# versions. The auditor is stdlib-only (HTMLParser); no model, no network.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The package editable, with the surfaces it advertises: without
          # [api,mcp] every test of api.py and mcp.py skipped, and CI was
          # green on code nobody ran.
          pip install -e ".[api,mcp]" -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
