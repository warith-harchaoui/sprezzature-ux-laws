<svg xmlns="http://www.w3.org/2000/svg" width="980" height="948" viewBox="0 0 980 948" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ux-laws-hiw-title ux-laws-hiw-desc"><title id="ux-laws-hiw-title">How sprezzature-ux-laws works</title><desc id="ux-laws-hiw-desc">Flow diagram. At the top, HTML source feeds two lanes. The left lane audits: it resolves what a single screen shows from the Tailwind display classes, reports the worse of the phone count and the desktop count, and decides eight named laws, returning findings that exit non-zero on an error. The right lane makes: it applies the four mechanical repairs. Both meet in one outcome, a screen whose measurable mistakes are gone.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="948" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">How sprezzature-ux-laws works</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">Eight named laws, and the fraction of each one a text scan can honestly decide.</text><rect x="36" y="104" width="908" height="68" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">HTML source</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">a file or a whole tree. No browser opens, no page renders, and nobody is watched using it.</text><path d="M490,172 V192 H254 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,204 L254,212 L258,204" fill="#C7C7CC"/><path d="M490,172 V192 H726 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,204 L726,212 L730,204" fill="#C7C7CC"/><rect x="36" y="212" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,220 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Audit: count the choices, not the elements</text><rect x="36" y="258" width="436" height="120" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Resolve what one screen shows</text><text x="54" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">a row marked hidden sm:inline and a hamburger marked</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">sm:hidden never appear together. Ancestors win over children:</text><text x="54" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">a container that hides its subtree beats a child that would</text><text x="54" y="363" font-size="13.5" font-weight="400" fill="#6E6E73">show.</text><path d="M254,378 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,394 L254,402 L258,394" fill="#C7C7CC"/><rect x="36" y="402" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="430" font-size="16" font-weight="600" fill="#1D1D1F">Report the worse of the two counts</text><text x="54" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">the phone reading or the desktop reading, and the finding says</text><text x="54" y="472" font-size="13.5" font-weight="400" fill="#6E6E73">which. A group is one choice: a details, a menu, a radiogroup,</text><text x="54" y="490" font-size="13.5" font-weight="400" fill="#6E6E73">a tablist each count once, whatever they hold.</text><path d="M254,504 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,520 L254,528 L258,520" fill="#C7C7CC"/><rect x="36" y="528" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="557" font-size="16" font-weight="600" fill="#1D1D1F">Decide the eight laws</text><text x="54" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">Hick, choice overload, Miller, Jakob, Fitts, aesthetic-usability,</text><text x="54" y="598" font-size="13.5" font-weight="400" fill="#6E6E73">selective attention, Tesler</text><path d="M254,613 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,629 L254,637 L258,629" fill="#C7C7CC"/><rect x="36" y="637" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,649 v61" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="666" font-size="16" font-weight="600" fill="#1D1D1F">Findings, error or warning</text><text x="65" y="690" font-size="13.5" font-weight="400" fill="#6E6E73">the process exits non-zero when an error is present, so it</text><text x="65" y="708" font-size="13.5" font-weight="400" fill="#6E6E73">drops into a continuous-integration run as it is</text><rect x="508" y="212" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,220 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Make: repair what has one safe repair</text><rect x="508" y="258" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Four of the eight carry a fixer</text><text x="526" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">a hit area raised to 44 pixels for Fitts, a focus ring put back</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">for aesthetic-usability, a digit run chunked for Miller, a clickable</text><text x="526" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">div turned into a button for Jakob</text><path d="M726,360 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,376 L726,384 L730,376" fill="#C7C7CC"/><rect x="508" y="384" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="413" font-size="16" font-weight="600" fill="#1D1D1F">Fix, re-audit, fix again</text><text x="526" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">a repair can create work: the fresh button needs its own hit</text><text x="526" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">area and focus ring. The loop runs to a fixed point,</text><text x="526" y="472" font-size="13.5" font-weight="400" fill="#6E6E73">and a second run on a fixed file applies nothing.</text><path d="M726,486 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,502 L726,510 L730,502" fill="#C7C7CC"/><rect x="508" y="629" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,641 v61" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="658" font-size="16" font-weight="600" fill="#1D1D1F">--fix, with --dry-run to look first</text><text x="537" y="682" font-size="13.5" font-weight="400" fill="#6E6E73">what needs a design decision is counted as skipped</text><text x="537" y="700" font-size="13.5" font-weight="400" fill="#6E6E73">and reported, never written</text><path d="M254,722 V743 H490 V756" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,756 L490,764 L494,756" fill="#C7C7CC"/><path d="M726,722 V743 H490 V756" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,756 L490,764 L494,756" fill="#C7C7CC"/><rect x="36" y="764" width="908" height="105" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,776 v81" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="793" font-size="16" font-weight="600" fill="#1D1D1F">A screen whose measurable mistakes are gone, which is not the same as a screen that answers the right</text><text x="65" y="813" font-size="16" font-weight="600" fill="#1D1D1F">question</text><text x="65" y="837" font-size="13.5" font-weight="400" fill="#6E6E73">Where the two responsive states are ambiguous the count goes up rather than down: a control that appears at md and disappears at lg</text><text x="65" y="854" font-size="13.5" font-weight="400" fill="#6E6E73">is treated as desktop-only. Over-reporting sends somebody to look. Under-reporting ships.</text><text x="36" y="895" font-size="13.5" font-weight="400" fill="#6E6E73">No dependencies at all, which is the point of it and the reason it is cheap enough for a pre-commit hook. It is a fast gate, not a substitute</text><text x="36" y="912" font-size="13.5" font-weight="400" fill="#6E6E73">for design review.</text></svg>
