[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-ux-laws"
version = "1.2.0"
description = "A static Laws-of-UX auditor for HTML: source-decidable checks for Hick, Miller, Fitts, Jakob, Tesler and more — no browser, no runtime DOM, no network."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["ux", "usability", "laws-of-ux", "accessibility", "html", "lint", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # The command line, and the only parser since 2026-10-25. This package
    # carried no base dependencies, and click is the one bought on purpose:
    # with argparse gone nothing ships with Python that can parse a command
    # line, so an optional click would mean an install whose own command does
    # not run. `sprezzature-ux-laws-audit` still needs nothing beyond it.
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy"]
# HTTP surface (sprezzature_ux_laws/api.py): the auditor over HTTP, so a
# design review or CI job in any language can run the same checks.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface: the same routes republished as agent tools, via fastapi-mcp.
mcp = [
    "sprezzature-ux-laws[api]",
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4.0 (the latest as of 2026-08) declares mcp>=1.12.0 with
    # no upper bound, but calls mcp's Server(name, description) positionally
    # -- mcp 2.0.0 made `description` keyword-only, so an unconstrained
    # resolve breaks FastApiMCP(...) at construction time (verified: pip
    # happily installs mcp 2.2.0 alongside fastapi-mcp 0.4.0, and
    # `sprezzature_ux_laws.mcp` then raises TypeError on import). Pin below
    # 2.0 until fastapi-mcp ships a fix.
    "mcp<2.0",
]
[project.scripts]
# The auditor is this package's reason to exist and it had no console script:
# the README told readers to run `python scripts/audit_laws_of_ux.py`, a path
# that exists in a clone and not in a wheel, and the parser's own --help
# advertised `sprezzature-ux-laws-audit`, which nothing installed. Someone who
# ran `pip install sprezzature-ux-laws` could reach the MCP server and nothing
# else.
sprezzature-ux-laws-audit = "sprezzature_ux_laws_scripts.audit_laws_of_ux:main"
# The click twin, over the same flags and the same handler. argparse because
# it is in the standard library and therefore always there; click because
# somebody whose other tools are click commands expects this one to be too.
sprezzature-ux-laws = "sprezzature_ux_laws.cli:main"
sprezzature-ux-laws-mcp = "sprezzature_ux_laws.mcp:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-ux-laws"

[tool.setuptools]
packages = ["sprezzature_ux_laws", "sprezzature_ux_laws_scripts"]

[tool.setuptools.package-dir]
"sprezzature_ux_laws_scripts" = "scripts"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` because the alternative is a marker that does nothing.
# pytest warns about an unknown mark and then runs the test anyway: a typo in
# `@pytest.mark.slow` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks, and that repository is the only one of the nine that had the
# flag. The flag is cheap, it fires at collection, and the whole suite now
# carries it -- scripts/test_the_suite_runs_tests_the_same_way.py in the hub
# checks that it still does.
addopts = "-ra --strict-markers"
